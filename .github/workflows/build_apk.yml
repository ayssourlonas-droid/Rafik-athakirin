name: Build APK

on:
  workflow_dispatch:
  push:
    branches: [main, master]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      # مجلد android يُولَّد هنا ولا يُرفع. ننسخ احتياطيًا ملفاتنا ونعيدها بعد التوليد
      # لضمان ألا يستبدلها الأمر بملفات القالب الافتراضية.
      - name: توليد مجلد أندرويد
        run: |
          mkdir -p /tmp/keep
          cp -r lib /tmp/keep/lib
          cp pubspec.yaml /tmp/keep/pubspec.yaml
          cp analysis_options.yaml /tmp/keep/analysis_options.yaml
          flutter create --platforms=android --org com.lamouchi --project-name rafiq_adhakirin .
          rm -rf lib && cp -r /tmp/keep/lib lib
          cp /tmp/keep/pubspec.yaml pubspec.yaml
          cp /tmp/keep/analysis_options.yaml analysis_options.yaml
          rm -rf test

      - name: اسم التطبيق بالعربية
        run: sed -i 's/android:label="[^"]*"/android:label="رفيق الذاكرين"/' android/app/src/main/AndroidManifest.xml

      # الصلاحيات ومستقبلات الإشعارات وdesugaring (يفشل بوضوح إن لم يجد النمط المتوقع)
      - name: تعديل أندرويد
        run: python3 tools/patch_android.py android

      # أصوات الأذان تُنسخ إلى موارد أندرويد الخام ليستعملها نظام الإشعارات مباشرة
      # (أسماؤها حروف صغيرة وأرقام وشرطة سفلية فقط، كما يشترط أندرويد)
      - name: نسخ الأذان إلى موارد أندرويد
        run: |
          mkdir -p android/app/src/main/res/raw
          cp assets/audio/adhan_*.mp3 android/app/src/main/res/raw/
          ls -la android/app/src/main/res/raw

      - run: flutter pub get

      - name: بناء APK
        run: flutter build apk --release --target-platform android-arm64

      - uses: actions/upload-artifact@v4
        with:
          name: rafiq-adhakirin-apk
          path: build/app/outputs/flutter-apk/app-release.apk
